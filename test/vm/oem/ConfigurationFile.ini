; SQL Server unattended install, for a machine that answers catalog queries and
; nothing else.
;
; The section header is [OPTIONS] from 2012 on. 2008 R2 wants [SQLSERVER2008],
; and provision.sh rewrites the line for that one release.
;
; The password is not here on purpose. setup.exe strips it out of a generated
; configuration file, and a file on a shared directory is the wrong place for
; one anyway, so install.bat passes /SAPWD on the command line.
[OPTIONS]
ACTION="Install"
FEATURES=SQLENGINE
QUIET="True"
INDICATEPROGRESS="False"
IACCEPTSQLSERVERLICENSETERMS="True"

; The default instance, so that the port is 1433 and no SQL Server Browser is
; needed. Express installs a named SQLEXPRESS instance unless told otherwise,
; and a named instance takes a dynamic port.
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

; Mixed mode, because the tests connect as sa over TCP from Linux and there is
; no domain to authenticate against.
SECURITYMODE="SQL"
SQLSYSADMINACCOUNTS="BUILTIN\Administrators"

; TCP on. This is necessary and not sufficient: the port still has to be fixed
; in the registry afterwards, which install.bat does.
TCPENABLED="1"
NPENABLED="0"

SQLSVCACCOUNT="NT AUTHORITY\SYSTEM"
SQLSVCSTARTUPTYPE="Automatic"
BROWSERSVCSTARTUPTYPE="Disabled"
