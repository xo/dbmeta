# Lint configuration for the test module.
#
# golangci-lint reads the go.mod of the directory it runs in, so this module is
# linted by its own run and needs its own configuration. It inherits nothing
# from the root.
#
# The difference that matters is depguard. This module holds the database
# drivers, which the root module must never import, so the allow list is wider
# here and narrow there. That split is the reason the module exists.
#
# The rule for adding to this file is the one in the root configuration. A
# linter that makes idiomatic Go worse is disabled with its reason beside it,
# and only a real defect gets a code change.
version: "2"

linters:
  default: all
  disable:
    # A test registers into a package level registry and names its fixtures at
    # package level, the same way the models do.
    - gochecknoinits
    - gochecknoglobals
    # Long SQL and long expected values.
    - goconst
    - lll
    - wsl
    - wsl_v5
    # A table driven test over 48 queries is long and flat, not complex.
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif
    - dupl
    # A test that opens a database builds a schema every other test reads, so
    # these run in order rather than in parallel.
    - paralleltest
    - tparallel
    # Style opinions.
    - err113
    - wrapcheck
    - nlreturn
    - varnamelen
    - exhaustruct
    - exhaustruct_v5
    - mnd
    - nilnil
    - ireturn
    - prealloc
    - noinlineerr
    - testpackage
    # depguard holds the dependency rule.
    - gomodguard
    - gomodguard_v2
    # A test builds its own indexes and reads a password from the environment,
    # and is not the attack surface gosec looks for.
    - gosec
    # The replace directive pointing at the parent is the whole point of this
    # module: it tests the working tree rather than a published version.
    - gomoddirectives
    # A switch that handles two of three enum values and answers the third
    # after the switch says more than an empty case with no body.
    - exhaustive
    # thelper reads a test body passed as a closure as a helper, and wants
    # t.Helper() at the top of it. Then a failure reports the line of the
    # runner rather than the line of the assertion, which is backwards.
    # The real helpers here call t.Helper() already.
    - thelper
  settings:
    # The drivers live here and nowhere else. Adding one to the root module is
    # the mistake this is here to stop, and the root configuration refuses it
    # from the other side.
    #
    # mattn/go-sqlite3 and duckdb/duckdb-go need cgo, which this module can
    # use and the root module must not. The separate go.mod is what makes that
    # safe. See D48.
    #
    # Every driver here is the one usql uses for the same database, which D52
    # requires. Check usql before adding one: its drivers are marked with a
    # // DRIVER comment on the import.
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/xo/dbmeta
            - github.com/go-sql-driver/mysql
            - github.com/duckdb/duckdb-go
            - github.com/mattn/go-sqlite3
            - modernc.org/sqlite
            - github.com/jackc/pgx
            - github.com/lib/pq
            - github.com/microsoft/go-mssqldb
            - github.com/sijms/go-ora
            - github.com/xo/cassandra
            - github.com/xo/dbimp
            - github.com/xo/dburl
            - github.com/nakagami/firebirdsql
            - github.com/SAP/go-hdb
            - github.com/beltran/gohive
            - github.com/apache/arrow-go
            - google.golang.org/grpc
            - github.com/exasol/exasol-driver-go
            - github.com/vertica/vertica-sql-go
            - github.com/sclgo/impala-go
            - github.com/ydb-platform/ydb-go-sdk
            - github.com/googleapis/go-sql-spanner
            - gorm.io/driver/bigquery
            - github.com/uber/athenadriver
            - github.com/databricks/databricks-sql-go
    # A deferred Close returns an error nothing can act on.
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Stmt).Close
        # The same, for the connection that runs a batch of DDL on Spanner.
        - (*database/sql.Conn).Close
        # The same, for the Flight SQL client that opens a GizmoSQL session.
        - (*github.com/apache/arrow-go/v18/arrow/flight/flightsql.Client).Close
        # A deferred Close on a file being read returns an error nothing can
        # act on, and the read already reported what mattered.
        - (*os.File).Close
        # Writing the help to a terminal. There is nowhere to report a
        # failure to write the report.
        - fmt.Fprint
        # A deferred Close on a response body being read. The read already
        # reported what mattered, and the connection is returned either way.
        - (io.ReadCloser).Close
        # A deferred RemoveAll on a temporary directory. There is nothing to
        # do about a failure and the operating system clears it regardless.
        - os.RemoveAll
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      disabled-checks:
        - exitAfterDefer

  exclusions:
    rules:
      # The container runtime chooses the shape of its own JSON. podman and
      # docker both write HostPort, and a tag that renames it stops
      # matching. The struct is a reader for somebody else's output.
      - path: cmd/dbrun/runner.go
        linters:
          - tagliatelle
      # Elasticsearch writes open_contexts, and the test reads it.
      - path: elasticsearch_test.go
        linters:
          - tagliatelle
      # A command prints. That is what it is for.
      - path: cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xo/dbmeta
