# Tests dbmeta on every push and pull request.
#
# Two jobs, both on one runner. The queries are SQL and the code is pure Go, so
# there is nothing to gain from a matrix of operating systems or architectures,
# and dbmeta does not carry a build constraint on either.
#
# The unit job opens no database connection. It renders statements and reads
# rows from a fake driver replaying recorded data, so it covers releases whose
# container images no longer start.
#
# The integration job runs the queries against a real server, which is the only
# thing that catches SQL a database rejects and a Go type the driver cannot
# fill. It tests four releases rather than one, chosen in D42: the floor, the
# ceiling, and one on each side of the middle. Every bug found so far would
# have been caught by those four, and four of the six would have been missed by
# testing the newest release alone.
#
# The nightly job runs all ten, because a wrong version gate is only visible in
# the window between the release it claims and the release that is true, and
# that window cannot be predicted.
#
# SQLite and DuckDB have no service container, because neither has a server:
# both are libraries, and the version is whichever one the pinned driver ships.
# They run in the embedded job, which starts nothing. SQLite runs against both
# of its drivers. See D42 and D48.
#
# MariaDB and MySQL are two products sharing one dialect and one model, so each
# has its own job and a third compares them. The compare job builds the same
# fixture on one server of each and checks that the same queries answer the
# same way, which is the only thing that catches a query written for one
# product and run against the other. See D44.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # every night, for the full release matrix
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint
        # Pinned. The configuration is `default: all`, so an unpinned upgrade
        # would enable a new linter and fail a build that changed nothing.
        # Both modules are linted, because golangci-lint reads the go.mod of
        # the directory it runs in and the test module has its own.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: Lint the test module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: test

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=2 ./...

      - name: Build without cgo
        # The root module has no driver and no cgo, and a consumer builds it
        # with CGO_ENABLED=0. That promise is checked rather than assumed.
        # The test module may use cgo and is built separately. See D48.
        run: CGO_ENABLED=0 go build ./...

      - name: Build the model tiers
        # a consumer chooses how many models to compile in, so each tier must
        # build. no_base is the tier with none.
        run: |
          for tag in no_base most all; do
            echo "building with -tags $tag"
            go build -tags "$tag" ./...
          done

  integration:
    name: PostgreSQL ${{ matrix.postgres }}
    # the nightly job covers these four and six more, so skip them there
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      # one release failing must not hide another, because the interesting
      # faults are version specific
      fail-fast: false
      matrix:
        # the floor, one on each side of the middle, and the ceiling. See D42.
        postgres: ["9.6", "12", "15", "18"]
    services:
      # health checks force TCP with -h, because pg_isready on the socket
      # reports ready during the bootstrap phase, before the server restarts
      # to accept connections.
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: P4ssw0rd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against PostgreSQL
        # test/ is a separate module, because it imports a database driver and
        # the root module must not. `./...` in the root does not reach it.
        #
        # This runs the conformance test too, which checks PostgreSQL against
        # the checked in expectation on every supported release. The canonical
        # projection is release independent, so one expectation covers 9.6 and
        # 18 alike, which is the reason it is canonical.
        working-directory: test
        env:
          DBMETA_POSTGRES: postgres://postgres:P4ssw0rd@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v ./...

  embedded:
    name: SQLite and DuckDB
    # No service container. SQLite is a library, so the release under test is
    # whichever one modernc.org/sqlite ships, and there is nothing to start.
    # The test still lives in the test module, because it needs that driver
    # and the root module holds no driver at all.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against SQLite
        # Two drivers, as subtests: mattn/go-sqlite3 compiles the upstream
        # SQLite source and needs cgo, and modernc.org/sqlite is a pure Go
        # translation. ubuntu-latest has the C compiler the first one needs.
        working-directory: test
        run: go test -count=1 -v -run SQLite ./...

      - name: Conformance, for the two embedded databases
        # Every database answers the checked in expectation for the core
        # fixture schema, canonically. A database that is not running skips
        # its section, so this job covers SQLite and DuckDB and the database
        # jobs cover theirs.
        working-directory: test
        run: go test -count=1 -v -run 'Conformance|CanonicalFields' ./...

      - name: Test against DuckDB
        # The other embedded database, and the other one needing cgo. Its
        # driver ships a prebuilt static library per platform, so there is
        # nothing to install beyond the compiler. See D48.
        working-directory: test
        run: go test -count=1 -v -run DuckDB ./...

  mariadb:
    name: MariaDB ${{ matrix.mariadb }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These come from container.MariaDB in the Go package, and a test
        # fails when the two disagree. 10.6 is the oldest maintained long term
        # release and 13.0 is the current stable.
        mariadb: ["10.6", "13.0"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against MariaDB
        working-directory: test
        env:
          DBMETA_MYSQL: root:P4ssw0rd@tcp(localhost:3306)/?parseTime=true
        run: go test -count=1 -v -run 'MySQL|InformationSchema|Conformance' ./...

  mysql:
    name: MySQL ${{ matrix.mysql }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These come from container.MySQL in the Go package, and a test fails
        # when the two disagree. 8.4 is the long term release and 26.7 is the
        # current innovation release, where MySQL's year based numbering
        # starts. They sit on either side of the one gate this model has for
        # MySQL, which is where a system variable moved in release 9.
        mysql: ["8.4", "26.7"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pP4ssw0rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against MySQL
        working-directory: test
        env:
          DBMETA_MYSQL: root:P4ssw0rd@tcp(localhost:3306)/?parseTime=true
        run: go test -count=1 -v -run 'MySQL|InformationSchema|Conformance' ./...

  sqlserver:
    name: SQL Server ${{ matrix.sqlserver }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every major release that ships a Linux container. These come from
        # container.SQLServer and a test fails when the two disagree. 2017 is a
        # hard floor: Microsoft shipped SQL Server on Linux from 2017, so there
        # is no container for 2016 or earlier. See D54.
        sqlserver: ["2017", "2019", "2022", "2025"]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: P4ssw0rd!x
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "for f in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do [ -x $f ] && exec $f -S localhost -U sa -P 'P4ssw0rd!x' -C -Q 'SELECT 1'; done; exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against SQL Server
        working-directory: test
        env:
          DBMETA_SQLSERVER: sqlserver://sa:P4ssw0rd%21x@localhost:1433?database=master&encrypt=disable
        run: go test -count=1 -v -run 'SQLServer|Conformance' ./...

  compare:
    name: MariaDB against MySQL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13.0
        env:
          MARIADB_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pP4ssw0rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Compare the two products
        working-directory: test
        env:
          DBMETA_MYSQL: root:P4ssw0rd@tcp(localhost:3306)/?parseTime=true
          DBMETA_MYSQL_COMPARE: root:P4ssw0rd@tcp(localhost:3307)/?parseTime=true
        run: go test -count=1 -v -run MySQLAgainstMariaDB ./...

  nightly-mysql:
    name: ${{ matrix.image }} (nightly)
    # The releases of the mysql dialect that a push does not carry. The list
    # comes from container.MariaDB and container.MySQL at the Nightly tier,
    # and a test fails when the two disagree.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["mariadb:10.11", "mariadb:11.4", "mariadb:11.8", "mariadb:12.3", "mysql:9.7"]
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: P4ssw0rd
          MYSQL_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pP4ssw0rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        working-directory: test
        env:
          DBMETA_MYSQL: root:P4ssw0rd@tcp(localhost:3306)/?parseTime=true
        run: go test -count=1 -v -run 'MySQL|InformationSchema' ./...

  nightly:
    name: PostgreSQL ${{ matrix.postgres }} (nightly)
    # every supported release, on a schedule rather than on a push. A wrong
    # version gate is only visible between the release it claims and the
    # release that is true, and nothing predicts that window, so the only
    # complete answer is to run them all. It is too slow for a push and cheap
    # enough for a night.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["9.6", "10", "11", "12", "13", "14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: P4ssw0rd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against PostgreSQL
        working-directory: test
        env:
          DBMETA_POSTGRES: postgres://postgres:P4ssw0rd@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./...
