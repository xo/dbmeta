# Tests dbmeta on every push and pull request.
#
# Two jobs, both on one runner. The queries are SQL and the code is pure Go, so
# there is nothing to gain from a matrix of operating systems or architectures,
# and dbmeta does not carry a build constraint on either.
#
# The unit job opens no database connection. It renders statements and reads
# rows from a fake driver replaying recorded data, so it covers releases whose
# container images no longer start.
#
# The integration job runs the queries against a real server, which is the only
# thing that catches SQL a database rejects and a Go type the driver cannot
# fill. It tests four releases rather than one, chosen in D42: the floor, the
# ceiling, and one on each side of the middle. Every bug found so far would
# have been caught by those four, and four of the six would have been missed by
# testing the newest release alone.
#
# The nightly job runs all ten, because a wrong version gate is only visible in
# the window between the release it claims and the release that is true, and
# that window cannot be predicted.
#
# SQLite and DuckDB have no service container, because neither has a server:
# both are libraries, and the version is whichever one the pinned driver ships.
# They run in the embedded job, which starts nothing. SQLite runs against both
# of its drivers. See D42 and D48.
#
# MariaDB and MySQL are two products sharing one dialect and one model, so each
# has its own job and a third compares them. The compare job builds the same
# fixture on one server of each and checks that the same queries answer the
# same way, which is the only thing that catches a query written for one
# product and run against the other. See D44.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # every night, for the full release matrix
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint
        # Pinned. The configuration is `default: all`, so an unpinned upgrade
        # would enable a new linter and fail a build that changed nothing.
        # Both modules are linted, because golangci-lint reads the go.mod of
        # the directory it runs in and the test module has its own.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: Lint the test module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: test

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=2 ./...

      - name: Build without cgo
        # The root module has no driver and no cgo, and a consumer builds it
        # with CGO_ENABLED=0. That promise is checked rather than assumed.
        # The test module may use cgo and is built separately. See D48.
        run: CGO_ENABLED=0 go build ./...

      - name: Build the model tiers
        # a consumer chooses how many models to compile in, so each tier must
        # build. no_base is the tier with none.
        run: |
          for tag in no_base most all; do
            echo "building with -tags $tag"
            go build -tags "$tag" ./...
          done

  embedded:
    name: SQLite and DuckDB
    # No service container. SQLite is a library, so the release under test is
    # whichever one modernc.org/sqlite ships, and there is nothing to start.
    # The test still lives in the test module, because it needs that driver
    # and the root module holds no driver at all.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against SQLite
        # Two drivers, as subtests: mattn/go-sqlite3 compiles the upstream
        # SQLite source and needs cgo, and modernc.org/sqlite is a pure Go
        # translation. ubuntu-latest has the C compiler the first one needs.
        working-directory: test
        run: go test -count=1 -v -run SQLite ./...

      - name: Conformance, for the two embedded databases
        # Every database answers the checked in expectation for the core
        # fixture schema, canonically. A database that is not running skips
        # its section, so this job covers SQLite and DuckDB and the database
        # jobs cover theirs.
        working-directory: test
        run: go test -count=1 -v -run 'Conformance|CanonicalFields' ./...

      - name: Test against DuckDB
        # The other embedded database, and the other one needing cgo. Its
        # driver ships a prebuilt static library per platform, so there is
        # nothing to install beyond the compiler. See D48.
        working-directory: test
        run: go test -count=1 -v -run DuckDB ./...

  releases:
    name: The release list
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.list.outputs.tested }}
      nightly: ${{ steps.list.outputs.nightly }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # The list lives in container/container.go and nowhere else. This job
      # reads it and hands it to the matrix below, so the workflow names no
      # image, no port and no release of its own and cannot drift from the Go
      # list. See D69.
      - name: Read the list
        id: list
        working-directory: test
        run: |
          {
            echo "tested=$(go run ./tool/servers --json tested)"
            echo "nightly=$(go run ./tool/servers --json nightly)"
          } >> "$GITHUB_OUTPUT"

  server:
    name: ${{ matrix.server }}
    needs: releases
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.releases.outputs.tested) }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # run.sh starts the server, waits for a real connection, runs the tests
      # against it and removes it. It is the same entry point a person uses,
      # which D68 requires, so CI cannot start a container a different way
      # from everybody else. It builds the Cassandra image when that is the
      # one being asked for.
      - name: Test against ${{ matrix.server }}
        env:
          DBMETA_RUNNER: docker
        run: ./test/run.sh "${{ matrix.server }}"

  nightly:
    name: ${{ matrix.server }} (nightly)
    needs: releases
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.releases.outputs.nightly) }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test against ${{ matrix.server }}
        env:
          DBMETA_RUNNER: docker
        run: ./test/run.sh "${{ matrix.server }}"

  compare:
    name: MariaDB against MySQL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: docker.io/library/mariadb:13.0
        env:
          MARIADB_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: docker.io/library/mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: P4ssw0rd
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pP4ssw0rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Compare the two products
        working-directory: test
        env:
          DBMETA_MYSQL: root:P4ssw0rd@tcp(localhost:3306)/?parseTime=true
          DBMETA_MYSQL_COMPARE: root:P4ssw0rd@tcp(localhost:3307)/?parseTime=true
        run: go test -count=1 -v -run MySQLAgainstMariaDB ./...
